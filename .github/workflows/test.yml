name: Test

# PR-gate CI for this repo: a `pytest` job whose check name feeds the
# code-review-reusable.yml loop's `ci_check_name` input (see code-review.yml
# in this same directory), plus a report-only `lint` job.
#
# This repo is `tier: inprocess` (aw-app.json) — it runs inside aw-workspace
# core's own Python process and has no `requirements.txt` of its own; its
# runtime deps are core's. The exact same gap already exists for
# `release.yml` (tekflox/aw-marketplace's `app-release.yml`), which already
# runs `python3 -m pytest tests/ -q` against this repo on every push to
# master with nothing more than `pip install pytest jsonschema fastapi httpx
# uvicorn` (+ requirements.txt/requirements-dev.txt IF present).
#
# `pytest` now also carries the docs/standards/pipeline-testing.md §4.2
# coverage ratchet (pyproject.toml's fail_under, added alongside this
# change) and the §5.2 blocking pylint E-class gate — the shared
# app-release.yml has no coverage/lint step yet (Phase 3 of the standard,
# a separate repo), so this repo's own gate carries it until then, same
# pattern as aw-app-template/aw-app-kb.
#
# No `paths:` filter on `pull_request`, deliberately: the review/merge loop
# requires this job's check to be PRESENT and passing before it will merge
# ("absent" must never read as "fine" — see code-review.yml's `ci_check_name`
# comment). A paths filter would let a docs-only PR never produce this check
# at all.
#
# `ubuntu-latest`, NOT `[self-hosted, aw-baremetal]`: this repo is PUBLIC
# and `pull_request` has no fork restriction here — a fork-authored PR's own
# `tests/`/install step would otherwise execute directly on the self-hosted
# baremetal pool, a known way to compromise self-hosted CI infrastructure.
# GitHub-hosted minutes are free on a public repo, so there is no cost
# reason to prefer self-hosted here anyway.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install -q pytest jsonschema fastapi httpx uvicorn
          if [ -f requirements.txt ]; then
            pip install -q -r requirements.txt
          fi
          if [ -f requirements-dev.txt ]; then
            pip install -q -r requirements-dev.txt
          fi

      - name: Test suite + coverage gate
        # fail_under is read from pyproject.toml's [tool.coverage.report] —
        # a one-way ratchet, see docs/standards/pipeline-testing.md §4.2.
        run: |
          python3 -m pytest --cov=notion_app --cov-report=term-missing \
            --cov-report=html --cov-report=xml tests/ -q

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
          retention-days: 30

      - name: Lint (pylint E-class, blocking)
        # --errors-only per §5.2, minus E0401/E1101 — same disable set as
        # aw-app-template/aw-app-kb. Measured 2026-11-06: one real finding
        # (E1136, notion_app/sync.py — an astroid-inference false positive
        # on a dict-literal-typed key, same class as E1101), disabled
        # inline at the site with a reason.
        run: pylint notion_app --disable=all --enable=E --disable=E0401,E1101

  # Report-only: ruff with its own defaults, plus the repo's new
  # pyproject.toml [tool.ruff.lint] select (E4,E7,E9,F,I) once this PR
  # lands. Stays report-only per §5.3 — pylint owns the blocking gate.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ruff check (report-only)
        run: |
          pip install -q ruff
          python -m ruff check . || true
